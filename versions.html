<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoLog — Version History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold text-orange-500 tracking-tight">CargoLog</a>
        <div class="flex items-center space-x-4">
            <div id="user-badge" class="hidden text-sm"></div>
            <div class="space-x-3 text-sm font-medium">
                <a href="index.html" class="text-gray-500 hover:text-orange-500 transition">Home</a>
                <a href="privacy.html" class="text-gray-500 hover:text-orange-500 transition">Privacy</a>
            </div>
        </div>
    </nav>

    <section class="container mx-auto px-6 py-12 max-w-3xl">

        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4">
                Version <span class="text-orange-500">History</span>
            </h1>
            <p class="text-gray-600">All releases of CargoLog from newest to oldest.</p>
        </div>

        <!-- ── Locale filter (visible to everyone) ────────────────── -->
        <div class="text-center mb-8">
            <button onclick="switchLocale('en', this)" class="locale-btn px-4 py-2 mx-1 border-2 border-orange-500 text-orange-500 rounded-full text-sm font-semibold transition active">English</button>
            <button onclick="switchLocale('ru', this)" class="locale-btn px-4 py-2 mx-1 border-2 border-orange-500 text-orange-500 rounded-full text-sm font-semibold transition">Русский</button>
            <button onclick="switchLocale('he', this)" class="locale-btn px-4 py-2 mx-1 border-2 border-orange-500 text-orange-500 rounded-full text-sm font-semibold transition">עברית</button>
        </div>

        <!-- ── Admin block (visible only to whitelisted emails) ──── -->
        <div id="admin-block" class="hidden bg-white rounded-2xl shadow-md p-6 mb-8 border-2 border-orange-200">
            <h2 class="text-xl font-bold text-gray-900 mb-4">
                <i class="fa-solid fa-plus-circle text-orange-500 mr-2"></i>
                Add a new version
            </h2>
            <form id="admin-add-version-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Version number</label>
                    <input type="text" name="version" required placeholder="0.2.6"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Language for this entry</label>
                    <select name="locale" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                        <option value="en">English</option>
                        <option value="ru">Русский</option>
                        <option value="he">עברית</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Changes (one per line)</label>
                    <textarea name="changes" required rows="6"
                              placeholder="Added Fuel Drop dialog for tankers&#10;Fixed odometer validation across all wizard steps&#10;Improved trip history layout"
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none font-mono text-sm"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" data-orig-label="Save"
                            class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-6 py-2 rounded-lg shadow transition">
                        Save
                    </button>
                </div>
            </form>
            <p class="text-xs text-gray-500 mt-3">
                <i class="fa-solid fa-info-circle mr-1"></i>
                The entry will appear only on the page in the chosen language. To publish in all 3 languages, add 3 separate entries.
            </p>
        </div>

        <!-- ── Versions list ──────────────────────────────────────── -->
        <div id="versions-list"></div>

    </section>

    <footer class="bg-gray-900 text-white py-12 mt-12">
        <div class="container mx-auto px-6 text-center">
            <div class="flex justify-center space-x-8 mb-6">
                <a href="https://t.me/TripLog_app" target="_blank" class="text-gray-400 hover:text-blue-400 text-3xl transition"><i class="fa-brands fa-telegram"></i></a>
                <a href="mailto:germormdev@gmail.com" class="text-gray-400 hover:text-red-400 text-3xl transition"><i class="fa-solid fa-envelope"></i></a>
                <a href="https://www.facebook.com/CargoLogApp" target="_blank" class="text-gray-400 hover:text-blue-600 text-3xl transition"><i class="fa-brands fa-facebook"></i></a>
            </div>
            <div class="flex justify-center space-x-6 mb-4 text-sm">
                <a href="privacy.html" class="text-gray-400 hover:text-orange-400 transition">Privacy Policy</a>
                <a href="index.html" class="text-gray-400 hover:text-orange-400 transition">Home</a>
            </div>
            <p class="text-gray-500 text-sm">© 2026 CargoLog</p>
        </div>
    </footer>

    <style>
        .locale-btn:not(.active) { background: transparent; }
        .locale-btn.active { background: #f97316; color: white !important; border-color: #f97316; }
    </style>

    <script>
        // Переключатель локали для просмотра — меняет document.lang
        // и перерисовывает список через signin.js
        function switchLocale(lang, btn) {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
            document.querySelectorAll('.locale-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // Перезагрузим страницу с правильным lang в URL
            // (signin.js читает lang один раз при старте через document.documentElement.lang)
            location.hash = '#' + lang;
            location.reload();
        }
        // При загрузке — проверим hash
        if (location.hash) {
            const lang = location.hash.replace('#', '');
            if (['en', 'ru', 'he'].includes(lang)) {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
                document.addEventListener('DOMContentLoaded', () => {
                    document.querySelectorAll('.locale-btn').forEach(b => {
                        if (b.textContent.trim() === ({en:'English',ru:'Русский',he:'עברית'}[lang])) {
                            document.querySelectorAll('.locale-btn').forEach(x => x.classList.remove('active'));
                            b.classList.add('active');
                        }
                    });
                });
            }
        }
    </script>

    <script type="module" src="signin.js"></script>
</body>
</html>
